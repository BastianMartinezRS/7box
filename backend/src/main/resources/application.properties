spring.application.name=sevenbox-backend
server.port=${PORT:8080}

# Base de datos H2 persistente en disco (facil de migrar a MySQL/PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sevenboxdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola H2 para inspeccion en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JWT
app.jwt.secret=${JWT_SECRET:7box-super-secret-key-para-desarrollo-fullstack-2026-debe-ser-larga}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (frontend Vite por defecto)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
