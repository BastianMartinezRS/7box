<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7box - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card bg-card border-secondary p-4 shadow-lg" style="max-width: 380px; width: 100%;">
    <div class="text-center mb-4">
      <h1 class="text-white fw-bold display-6">7box</h1>
      <p class="text-muted small">Ingresa para guardar tus listas de películas</p>
    </div>

    
    <ul class="nav nav-pills nav-justified mb-3">
      <li class="nav-item">
        <button class="nav-link active" id="tab-login" onclick="showAuthForm('login')">Ingresar</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-register" onclick="showAuthForm('register')">Registrarse</button>
      </li>
    </ul>

    
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label text-muted">Usuario</label>
        <input type="text" id="login-username" class="form-control" required placeholder="Tu usuario">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted">Contraseña</label>
        <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-purple w-100">Ingresar</button>
    </form>

    
    <form id="register-form" class="d-none">
      <div class="mb-3">
        <label class="form-label text-muted">Nuevo Usuario</label>
        <input type="text" id="reg-username" class="form-control" required placeholder="Nombre de usuario">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted">Contraseña</label>
        <input type="password" id="reg-password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
