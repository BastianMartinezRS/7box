services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - JWT_SECRET=${JWT_SECRET:-7box-super-secret-key-para-desarrollo-fullstack-2026-debe-ser-larga}
    volumes:
      - sevenbox_data:/app/data
    restart: unless-stopped

volumes:
  sevenbox_data:
